# Keep the PostHog SDK current (@posthog/mcp and posthog-node).
# .github/workflows/dependabot-auto-merge.yml merges these PRs when they
# change nothing but PostHog package versions. Merging doesn't publish to npm;
# publishing stays a manual step.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    allow:
      - dependency-name: "@posthog/*"
      - dependency-name: "posthog-node"
    groups:
      posthog:
        patterns:
          - "@posthog/*"
          - "posthog-node"
    open-pull-requests-limit: 2
    # Propose a release once it's a day old, not seven: the 7-day wait is on
    # merging instead. Dependabot still runs weekly, so a PR opens on the
    # Monday after a release. dependabot-auto-merge.yml merges it only once
    # the bumped releases are 7 days old, and dependabot-recheck.yml re-runs that check
    # every 6 hours until then. (PostHog's Shai-Hulud post-mortem suggests
    # waiting at least 3 days.) The one day keeps next Monday's run from
    # replacing a PR just before it would merge. Security updates skip the
    # cooldown.
    cooldown:
      default-days: 1
    commit-message:
      prefix: "chore(deps)"
